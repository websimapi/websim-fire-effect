<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fire Effect</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a; /* Dark background for contrast */
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            position: relative; /* Ensure body is positioned for absolute/fixed children */
            overflow: hidden; /* Hide overflow from fire effect */
        }

        .fire-container {
            position: fixed; /* Position relative to the viewport */
            bottom: 0; /* Stick to the bottom */
            left: 0;
            width: 100%; /* Cover the full width */
            height: 50vh; /* Cover the bottom half of the viewport height */
            z-index: 1; /* Place it above the background but below the title/buttons */
            pointer-events: none; /* Allow clicks/interactions to pass through */
            overflow: hidden; /* Clip any fire elements that go beyond the container */
            filter: url(#fire-distortion); /* Link to SVG filter */
            display: flex; /* Use flex to position layers */
            align-items: flex-end; /* Align layers to the bottom */
            justify-content: center; /* Center layers horizontally */
        }

        /* Base styles for each fire layer */
        .fire-layer {
            position: absolute; /* Position layers absolutely within container */
            bottom: 0;
            left: -10%; /* Extend beyond left edge */
            width: 120%; /* Extend beyond right edge */
            height: 100%;
            background-size: 100% 250%; /* Make gradient taller for more vertical movement */
            /* Default opacity and blend mode */
            opacity: 0.7;
            mix-blend-mode: screen; /* Can experiment with blend modes, 'screen' often works well for additive glow */
        }

        /* Specific styles for each layer */
        .fire-layer:nth-child(1) {
            background: radial-gradient(ellipse at center bottom, rgba(255, 200, 0, 0.8) 0%, rgba(255, 100, 0, 0.6) 30%, rgba(180, 30, 0, 0.4) 60%, rgba(0, 0, 0, 0) 80%);
            animation: fire-anim-1 10s infinite ease-in-out;
            opacity: 0.9;
        }

        .fire-layer:nth-child(2) {
            background: radial-gradient(ellipse at center bottom, rgba(255, 150, 0, 0.7) 0%, rgba(255, 50, 0, 0.5) 40%, rgba(150, 20, 0, 0.3) 70%, rgba(0, 0, 0, 0) 90%);
            animation: fire-anim-2 12s infinite ease-in-out reverse;
            opacity: 0.8;
            /* Add subtle horizontal shift */
            transform: translateX(5%);
        }

        .fire-layer:nth-child(3) {
            background: radial-gradient(ellipse at center bottom, rgba(255, 100, 0, 0.6) 0%, rgba(200, 30, 0, 0.4) 50%, rgba(100, 10, 0, 0.2) 80%, rgba(0, 0, 0, 0) 100%);
            animation: fire-anim-3 8s infinite linear; /* Linear for a more constant flicker feel */
            opacity: 0.6;
            /* Add subtle horizontal shift */
            transform: translateX(-8%);
        }

        .fire-layer:nth-child(4) {
            background: radial-gradient(ellipse at center bottom, rgba(255, 50, 0, 0.5) 0%, rgba(150, 20, 0, 0.3) 60%, rgba(50, 5, 0, 0.1) 90%, rgba(0, 0, 0, 0) 100%);
             animation: fire-anim-4 9s infinite ease-in-out;
             opacity: 0.5;
             /* Add subtle horizontal shift */
             transform: translateX(10%);
        }


        /* Keyframes for the fire layers - varied slightly */
        @keyframes fire-anim-1 {
            0% {
                transform: scale(1, 1) translateY(0) translateX(0);
                background-position: 50% 0%;
            }
            50% {
                transform: scale(1.05, 0.98) translateY(3%) translateX(2%);
                background-position: 50% 100%;
            }
            100% {
                transform: scale(1, 1) translateY(0) translateX(0);
                background-position: 50% 0%;
            }
        }

        @keyframes fire-anim-2 {
             0% {
                transform: scale(0.98, 1.02) translateY(0) translateX(0);
                background-position: 50% 100%;
            }
            50% {
                transform: scale(1, 1) translateY(-4%) translateX(-3%);
                 background-position: 50% 0%;
            }
            100% {
                transform: scale(0.98, 1.02) translateY(0) translateX(0);
                 background-position: 50% 100%;
            }
        }

        @keyframes fire-anim-3 {
             0% {
                transform: scale(1.02, 0.95) translateY(0) translateX(0);
                background-position: 50% 50%;
            }
            25% {
                transform: scale(1, 1) translateY(2%) translateX(4%);
                 background-position: 50% 0%;
            }
            50% {
                transform: scale(0.98, 1.05) translateY(-2%) translateX(0);
                 background-position: 50% 100%;
            }
             75% {
                transform: scale(1, 1) translateY(1%) translateX(-4%);
                 background-position: 50% 0%;
            }
            100% {
                transform: scale(1.02, 0.95) translateY(0) translateX(0);
                 background-position: 50% 50%;
            }
        }

        @keyframes fire-anim-4 {
            0% {
                transform: scale(1.05, 0.9) translateY(0) translateX(0);
                background-position: 50% 20%;
            }
             50% {
                transform: scale(1, 1.05) translateY(-6%) translateX(5%);
                background-position: 50% 80%;
            }
            100% {
                transform: scale(1.05, 0.9) translateY(0) translateX(0);
                background-position: 50% 20%;
            }
        }

        /* Content styles to place it above fire */
        .content {
            position: relative; /* Position relative to be above the fire */
            z-index: 2; /* Higher z-index than fire-container */
            padding: 20px;
        }

    </style>
</head>
<body>

    <!-- SVG Filter for Distortion -->
    <!-- This filter applies a turbulence effect to create a flickering, wavy distortion -->
    <!-- It is applied to the .fire-container via the 'filter' CSS property -->
    <svg style="position: absolute; bottom: 0; left: 0; width: 0; height: 0;">
        <filter id="fire-distortion">
             <feTurbulence type="turbulence" baseFrequency="0.005 0.01" numOctaves="2" result="turbulence" seed="0"/>
            <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="10" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
            <feGaussianBlur in="displaced" stdDeviation="3" result="blurred"/>
            <feBlend in="SourceGraphic" in2="blurred" mode="screen"/>
        </filter>
    </svg>


    <div class="content">
        <h1>Welcome to the Inferno</h1>
        <p>Behold the animated fire effect!</p>
    </div>

    <div class="fire-container">
        <div class="fire-layer"></div>
        <div class="fire-layer"></div>
        <div class="fire-layer"></div>
        <div class="fire-layer"></div>
    </div>

</body>
</html>
